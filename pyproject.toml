[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "michiflin-next"
version = "0.1.0.dev0"
description = "A bilingual, offline-first Delta Chat assistant and personal workspace"
requires-python = ">=3.12"
dependencies = ["requests[socks]>=2.32,<3", "defusedxml>=0.7.1,<1"]

[project.optional-dependencies]
bot = ["deltachat2==2.58.0", "deltachat-rpc-server==2.58.0", "cryptography>=44,<47"]
test = ["pytest>=8,<10", "ruff>=0.11,<1", "pillow>=11,<14"]
browser = ["playwright==1.58.0"]

[project.scripts]
michiflin = "michiflin.cli:main"
michiflin-bot = "michiflin.runtime:main"

[tool.hatch.build.targets.wheel]
packages = ["src/michiflin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM"]
