name: Validate workspace
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright/python@sha256:cd8493e380df200a471821e2690b710eab8d793dde3c0946fd0a39a961022914
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test,browser,bot]'
      - run: ruff check src tests tools
      - run: python -m pytest -q
      - run: python tools/check_javascript.py
      - run: python -m michiflin.cli build
  isolated-workers:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y bubblewrap libseccomp2
      - run: sudo bash tools/setup_sandbox.sh
      - run: python -m pip install -e '.[test]'
      - run: python tools/check_sandbox.py
      - run: python -m pytest -q tests/test_jobs.py tests/test_sandbox.py tests/test_job_runner.py
        env:
          MICHIFLIN_REQUIRE_SANDBOX: '1'
