name: Check public data sources
on:
  workflow_dispatch:
    inputs:
      use_warp:
        description: Route public source probes through verified local WARP
        type: boolean
        default: false
      check_media:
        description: Query actual YouTube metadata, not a video download
        type: boolean
        default: true
      check_reader:
        description: Fetch and parse a real public web page
        type: boolean
        default: true
      check_download:
        description: Fetch and validate an actual public-domain EPUB
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Set up verified WARP proxy
        if: inputs.use_warp
        timeout-minutes: 5
        run: bash tools/setup_warp.sh
      - name: Probe public sources, reader and optional ebook delivery
        env:
          CHECK_MEDIA: ${{ inputs.check_media }}
          CHECK_READER: ${{ inputs.check_reader }}
          CHECK_DOWNLOAD: ${{ inputs.check_download }}
        run: |
          args=()
          if [ "$CHECK_DOWNLOAD" = true ]; then args+=(--download); fi
          if [ "$CHECK_READER" = true ]; then args+=(--reader); fi
          if [ "$CHECK_MEDIA" = true ]; then args+=(--media); fi
          python -m michiflin.diagnostics "${args[@]}"
      - name: Disconnect WARP
        if: always() && inputs.use_warp
        run: warp-cli --accept-tos disconnect || true
