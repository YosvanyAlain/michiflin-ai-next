name: Check public data sources
on:
  workflow_dispatch:
    inputs:
      use_warp:
        description: Route public source probes through verified local WARP
        type: boolean
        default: false
      check_download:
        description: Fetch and validate an actual public-domain EPUB
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Set up verified WARP proxy
        if: inputs.use_warp
        timeout-minutes: 5
        run: bash tools/setup_warp.sh
      - name: Probe search, weather and optional ebook delivery
        env:
          CHECK_DOWNLOAD: ${{ inputs.check_download }}
        run: |
          if [ "$CHECK_DOWNLOAD" = true ]; then
            python -m michiflin.diagnostics --download
          else
            python -m michiflin.diagnostics
          fi
      - name: Disconnect WARP
        if: always() && inputs.use_warp
        run: warp-cli --accept-tos disconnect || true
